name: Update VPN Configs

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator (safe — no TCP/ping/port checks)
        run: |
          python export_subscription.py \
            --max-total 5000 \
            --max-per-protocol 1000

      - name: Commit and push updated output files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update VPN configs [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
